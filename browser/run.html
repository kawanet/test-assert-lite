<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>{{title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<pre id="output"></pre>
<script type="module">
    import {end, load, session, stdout} from "test-assert-lite/session"

    // The CLI puts its config into the head as JSON, ahead of this script.
    const json = document.querySelector(`script[type="application/vnd.test-session+json"]`)?.textContent
    const options = json && JSON.parse(json)?.session || {}

    // The run's URL is this page's own directory: the session reports
    // there, takes the errors outside the tests, and the console goes
    // the same way.
    session({
        base: new URL("./", import.meta.url),
        capture: true,
        console: console,
        reporter: options.reporter,
        quiet: options.quiet,
        output: text => {
            document.querySelector("#output")?.append(text)
            stdout.write(text)
        },
    })

    const files = (options?.files ?? [])

    for (const file of files) {
        await load(file)
    }

    await end().catch(console.error)
</script>
</body>
</html>
