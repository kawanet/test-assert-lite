<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>{{title}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body>
<pre id="output"></pre>
<script type="module">
    import {end, load, session, ipc} from "test-assert-lite/session"

    // The CLI puts its config into the head as JSON, ahead of this script.
    const json = document.querySelector(`script[type="application/vnd.test-session+json"]`)?.textContent
    const options = json && JSON.parse(json)?.session || {}
    const bridge = ipc({fetch})

    // The page reports with its own fetch, to the run's URL it sits under:
    // it takes the window's errors outside the tests, and the console goes
    // the same way.
    session({
        bridge: bridge,
        uncaught: window,
        console: console,
        reporter: options.reporter,
        quiet: options.quiet,
        output: text => {
            document.querySelector("#output")?.append(text)
            bridge.stdout.write(text)
        },
    })

    const files = (options?.files ?? [])

    for (const file of files) {
        await load(file)
    }

    await end().catch(console.error)
</script>
</body>
</html>
